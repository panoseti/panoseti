# hw_state_machine.toml
[state_machine]
initial = "UNPOWERED"
safe = "UNPOWERED"   # state to leave hardware in on framework exit

# States ordered loosely from "cold" → "warm" → "hot"
[[states]]
name = "UNPOWERED"
desc = "WPS outlet off."

[[states]]
name = "POWERED"
desc = "WPS outlet on; quabo CPU booting."

[[states]]
name = "BOOTED"
desc = "Quabo CPU up, FPGA loaded, ping responsive, registers at firmware default."

[[states]]
name = "HK_ROUTED"
desc = "Housekeeping packet destination routed to head node."

[[states]]
name = "MAROC_CONFIGURED"
desc = "MAROC chip registers programmed."

[[states]]
name = "MASKS_CONFIGURED"
desc = "Trigger masks and GOE masks loaded."

[[states]]
name = "PH_CALIBRATED"
desc = "Pulse Height baselines calibrated."

[[states]]
name = "HV_OFF_READY"
desc = "Ready to acquire data (HV off, using pulse generator)."

[[states]]
name = "HV_ON_READY"
desc = "Ready to acquire data (HV ramped up, physical detectors active)."

[[states]]
name = "ACQUIRING_HV_OFF"
desc = "DAQ mode bits set; quabo emitting science packets (HV off)."

[[states]]
name = "ACQUIRING_HV_ON"
desc = "DAQ mode bits set; quabo emitting science packets (HV on)."

# Primitives — atomic state transitions.
[[primitives]]
name = "wps_power_on"
from_states = ["UNPOWERED"]
to_state = "POWERED"
budget_s = { typical = 5, max = 15 }
safety = "high"
entrypoint = "control.power:quabo_power"
kwargs = { on = true }

[[primitives]]
name = "boot_verify"
from_states = ["POWERED"]
to_state = "BOOTED"
budget_s = { typical = 400, max = 600 }
safety = "low"
entrypoint = "hw_utils.driver_ops:boot_verify"

[[primitives]]
name = "wps_power_off"
from_states = ["*"]
to_state = "UNPOWERED"
budget_s = { typical = 5, max = 10 }
safety = "high"
entrypoint = "control.power:quabo_power"
kwargs = { on = false }

[[primitives]]
name = "tftp_reboot"
from_states = ["BOOTED", "HK_ROUTED", "MAROC_CONFIGURED", "MASKS_CONFIGURED", "PH_CALIBRATED", "HV_OFF_READY", "HV_ON_READY"]
to_state = "BOOTED"
budget_s = { typical = 400, max = 600 }
safety = "medium"
entrypoint = "control.driver.quabo_tftp:tftpw.reboot"

[[primitives]]
name = "soft_reset"
from_states = ["HK_ROUTED", "MAROC_CONFIGURED", "MASKS_CONFIGURED", "PH_CALIBRATED", "HV_OFF_READY", "HV_ON_READY", "ACQUIRING_HV_OFF", "ACQUIRING_HV_ON"]
to_state = "BOOTED"
budget_s = { typical = 1, max = 2 }
safety = "low"
entrypoint = "control.driver.quabo_driver:QUABO.reset"

[[primitives]]
name = "route_hk"
from_states = ["BOOTED"]
to_state = "HK_ROUTED"
budget_s = { typical = 1, max = 5 }
safety = "low"
entrypoint = "hw_utils.driver_ops:route_hk"

[[primitives]]
name = "configure_maroc"
from_states = ["HK_ROUTED", "HV_OFF_READY", "HV_ON_READY"]
to_state = "MAROC_CONFIGURED"
budget_s = { typical = 1, max = 5 }
safety = "low"
entrypoint = "hw_utils.driver_ops:configure_maroc"

[[primitives]]
name = "configure_masks"
from_states = ["MAROC_CONFIGURED"]
to_state = "MASKS_CONFIGURED"
budget_s = { typical = 1, max = 5 }
safety = "low"
entrypoint = "hw_utils.driver_ops:configure_masks"

[[primitives]]
name = "calibrate_ph"
from_states = ["MASKS_CONFIGURED"]
to_state = "PH_CALIBRATED"
budget_s = { typical = 15, max = 30 }
safety = "low"
entrypoint = "hw_utils.driver_ops:calibrate_ph"

[[primitives]]
name = "prepare_hv_off"
from_states = ["PH_CALIBRATED", "MASKS_CONFIGURED"]
to_state = "HV_OFF_READY"
budget_s = { typical = 2, max = 5 }
safety = "high"
entrypoint = "hw_utils.driver_ops:hv_zero"

[[primitives]]
name = "prepare_hv_on"
from_states = ["PH_CALIBRATED", "MASKS_CONFIGURED"]
to_state = "HV_ON_READY"
budget_s = { typical = 2, max = 10 }
safety = "high"
entrypoint = "hw_utils.driver_ops:hv_set_from_config"
guards = ["shutter_must_be_closed", "light_sensor_dark"]

[[primitives]]
name = "start_acq_hv_off"
from_states = ["HV_OFF_READY"]
to_state = "ACQUIRING_HV_OFF"
budget_s = { typical = 5, max = 15 }
safety = "low"
entrypoint = "hw_utils.run_ops:start_run_via_cli"
kwargs = { no_hv = true }

[[primitives]]
name = "start_acq_hv_on"
from_states = ["HV_ON_READY"]
to_state = "ACQUIRING_HV_ON"
budget_s = { typical = 5, max = 15 }
safety = "low"
entrypoint = "hw_utils.run_ops:start_run_via_cli"
kwargs = { no_hv = false }

[[primitives]]
name = "stop_acq_hv_off"
from_states = ["ACQUIRING_HV_OFF"]
to_state = "HV_OFF_READY"
budget_s = { typical = 60, max = 90 }
safety = "low"
entrypoint = "hw_utils.run_ops:stop_run_via_cli"

[[primitives]]
name = "stop_acq_hv_on"
from_states = ["ACQUIRING_HV_ON"]
to_state = "HV_ON_READY"
budget_s = { typical = 60, max = 90 }
safety = "low"
entrypoint = "hw_utils.run_ops:stop_run_via_cli"
