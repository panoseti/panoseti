# hw_tests.toml — HITL test classification, mapping, and topology requirements.
# All test classification lives here; no test file references class names as strings.

[settings]
default_safety_check = "before_each_batch"
emergency_teardown_state = "UNPOWERED"
preflight_marker = "preflight"

# ── Test classes ──────────────────────────────────────────────────────────────
# batch_priority controls execution order (lower = earlier).
# Tests with the same priority run in a single batch (same required_state).

[classes.env_check]
description = "Pre-boot environment validation: config files, WPS CURL, DAQ ping, DAQ SSH."
required_state = "UNPOWERED"
leaves_state = "UNPOWERED"
batch_priority = -2
preflight = false
parallel = false

[classes.boot_sequence]
description = "Annotated boot from UNPOWERED: WPS on → boot wait → get_uids → TFTP reboot → echo check."
required_state = "UNPOWERED"
leaves_state = "BOOTED"
batch_priority = -1
preflight = false
parallel = false

[classes.driver_protocol]
description = "Low-level UDP/TFTP packet protocol verification against real quabos."
required_state = "BOOTED"
leaves_state = "BOOTED"
batch_priority = 1
preflight = false
parallel = false

[classes.telemetry]
description = "HK packet pipeline: UDP → capture_hk.py → Redis → InfluxDB."
required_state = "HK_ROUTED"
leaves_state = "HK_ROUTED"
batch_priority = 0
preflight = true
parallel = false

[classes.fast_reconfig]
description = "Configuration changes + short observation, no power cycle."
required_state = "MASKS_CONFIGURED"
leaves_state = "MASKS_CONFIGURED"
batch_priority = 1
preflight = true
parallel = false

[classes.observing]
description = "Real DAQ flow: pseti start → record → pseti stop → transfer → verify."
required_state = "HV_OFF_READY"
leaves_state = "HV_OFF_READY"
batch_priority = 2
preflight = true
parallel = false

[classes.lifecycle]
description = "Power cycle, firmware reboot, baseline calibration."
required_state = "UNPOWERED"
leaves_state = "BOOTED"
batch_priority = 3
preflight = false
parallel = false

# ── Test → class mapping (node-id glob patterns) ──────────────────────────────
# The glob is matched against the pytest node ID (relative to the hardware_software/ dir).
# First matching entry wins.

[[mapping]]
glob = "*/hw_boot/test_env_check*"
class = "env_check"

[[mapping]]
glob = "*/hw_boot/**"
class = "boot_sequence"

[[mapping]]
glob = "*/hw0_driver_protocol/**"
class = "driver_protocol"

[[mapping]]
glob = "*/hw1_reconfig/**"
class = "fast_reconfig"

[[mapping]]
glob = "*/hw2_observing/**"
class = "observing"

[[mapping]]
glob = "*/hw3_lifecycle/**"
class = "lifecycle"

[[mapping]]
glob = "*/hw4_telemetry/**"
class = "telemetry"

# ── Topology requirements ──────────────────────────────────────────────────────
# Tests matching a glob are skipped (not failed) if the active topology lacks
# the required capability, module count, or DAQ node count.

[[requirements]]
glob = "*/hw2_observing/*multinode*"
requires_min_modules = 2
requires_min_daq_nodes = 2

[[requirements]]
glob = "*/hw3_lifecycle/test_lifecycle.py::test_wr_sync*"
requires_capability = "white_rabbit"

[[requirements]]
glob = "*/hw3_lifecycle/test_lifecycle.py::test_gnss_lock*"
requires_capability = "gnss"

[[requirements]]
glob = "*/hw0_driver_protocol/*port_forwarding*"
requires_capability = "port_forwarding"
