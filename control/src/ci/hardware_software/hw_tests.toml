# hw_tests.toml — HITL test classification, mapping, and topology requirements.
# All test classification lives here; no test file references class names as strings.
#
# MVP scope: only env_check, boot_sequence, and happy_path are active.
# Archived suites live in suites/_archived/ and are excluded from collection.

[settings]
default_safety_check = "before_each_batch"
emergency_teardown_state = "UNPOWERED"
preflight_marker = "preflight"

# ── Test classes ──────────────────────────────────────────────────────────────
# batch_priority controls execution order (lower = earlier).

[classes.env_check]
description = "Pre-boot environment validation: config files, WPS CURL, DAQ ping, DAQ SSH."
required_state = "UNPOWERED"
leaves_state = "UNPOWERED"
batch_priority = -2
preflight = false
parallel = false

[classes.boot_sequence]
description = "Full boot from UNPOWERED through PH_CALIBRATED (mirrors pseti session-start)."
required_state = "UNPOWERED"
leaves_state = "PH_CALIBRATED"
batch_priority = -1
preflight = false
parallel = false

[classes.happy_path]
description = "Parameterized observing loop: start → record → stop → transfer → verify."
required_state = "PH_CALIBRATED"
leaves_state = "PH_CALIBRATED"
batch_priority = 0
preflight = true
parallel = false

# ── Test → class mapping (node-id glob patterns) ──────────────────────────────
# The glob is matched against the pytest node ID (relative to the hardware_software/ dir).
# First matching entry wins.

[[mapping]]
glob = "*/hw_boot/test_env_check*"
class = "env_check"

[[mapping]]
glob = "*/hw_boot/**"
class = "boot_sequence"

[[mapping]]
glob = "*/core_happy_path/**"
class = "happy_path"
