services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  unit-test-runner:
    image: pseti-test-runner:latest
    build:
      context: ${PSETI_ROOT_BUILD}/
      dockerfile: control/src/ci/Dockerfile.ci
      target: test-runner
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
        DOCKER_GID: "${DOCKER_GID:-999}"

    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # Mount repo for live edits during local development
      - ${PSETI_CONTROL_BUILD}:/app
      - ${PSETI_ROOT_BUILD}/grpc:/grpc
    working_dir: /app
    # Keeps container running in the background for `qa.py` execution
    command: ["sleep", "infinity"]
    profiles:
      - unit
