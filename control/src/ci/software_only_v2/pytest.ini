[pytest]
markers =
    tier1: Pure in-process logic and Pydantic validation (no containers)
    tier2: State-machine logic with isolated workspace (no containers)
    tier3: Distributed fleet with sim daqnodes (testcontainers)
    tier4: Fault injection over a live fleet (testcontainers + chaos)
    tier5: Real hashpipe binary, static Docker Compose stack
