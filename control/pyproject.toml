[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panoseti-control"
version = "0.1.0"
description = "PANOSETI observatory instrument control system"
requires-python = ">=3.14"
dependencies = [
    "astropy>=5.2",
    "numpy>=1.24",
    "influxdb>=5.3",
    "redis>=7",
    "psutil>=5.9",
    "haversine>=2.9",
    "GitPython>=3.1",
    "PyYAML>=6.0",
    "pyserial>=3.5",
    "requests>=2.31",
    "rich>=13.0",
    "pydantic>=2.0",
    "tftpy>=0.8.2",
    "typing_extensions>=4.5",
    "panoseti_grpc>=0.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "fakeredis>=2.26",
    "mypy>=1.9",
    "ruff>=0.4",
    "numpy>=1.24",
    "docker>=7.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
    "types-requests",
    "types-paramiko",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "driver*", "daemons*"]

[tool.pytest.ini_options]
testpaths = ["ci"]
# Add control/ itself to sys.path so "from utils.X import ..." works in tests
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]
ignore = [
    "E501",   # line too long – handled separately
    "B008",   # function calls in default args (common in Pydantic)
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
strict = false
check_untyped_defs = true
strict_equality = true
extra_checks = true
ignore_missing_imports = true
warn_return_any = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
