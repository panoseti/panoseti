# ── Global settings ──────────────────────────────────────────────────────────

[settings]
default_parallel = 4
project_prefix = "pseti"

# ── Physical Environments ────────────────────────────────────────────────────
[environments.ucb]
config_dir = "ci/hardware-software/configs"
compose_file = "ci/docker-compose.hw-sw.yml"

# ── Test Suites ──────────────────────────────────────────────────────────────

[suites.lint]
description = "Static analysis (Ruff + MyPy)"
type = "lint"
requires_docker = true
compose_file = "ci/docker-compose.unit.yml"
profiles = ["unit"]
service = "unit-test-runner"
tasks = { ruff = "uv run ruff check . --fix --color=always", mypy = "uv run mypy . --explicit-package-bases --color-output" }

[suites.unit]
description = "Tier 1: Parallel unit tests (Logic & Parsing)"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.unit.yml"
profiles = ["unit"]
service = "unit-test-runner"
test_dir = "ci/tier1_unit/"
parallel = true

[suites.logic]
description = "Tier 2: Subsystem logic (Isolated State, Mocked gRPC)"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.unit.yml"
profiles = ["unit"]
service = "unit-test-runner"
test_dir = "ci/tier2_logic/"
parallel = true

[suites.fleet]
description = "Tier 3: Distributed flows (Dynamic Fleets, Real gRPC)"
type = "test"
requires_docker = false
test_dir = "ci/tier3_fleet/"
parallel = true

[suites.chaos]
description = "Tier 4: Fault injection (Active failure scenarios)"
type = "test"
requires_docker = false
test_dir = "ci/tier4_chaos/"
env = { ENABLE_TELEMETRY_TESTS = "1" }

[suites.integration]
description = "Tier 5: Heavy Integration (Hashpipe, Static stack)"
type = "test"
service = "int-tester"
requires_docker = true
compose_file = "ci/docker-compose.integration.yml"
test_dir = "ci/tier5_integration/"
pytest_args = ["--ignore=ci/integration/scenarios"]
env = { HEAD_NET_PREFIX = "10.0.1", DAQ_NET_PREFIX = "192.168.0", QUABO_NET_PREFIX = "192.168.3", ENABLE_TELEMETRY_TESTS = "1", RUN_REAL_DATA_TESTS = "1", DAQNODE_CONTAINER_NAME = "pseti-integration-daqnode-1", PSETI_CONFIG = "/tmp/pseti_test/integration_configs", PSETI_TMP = "/tmp/pseti_test/tmp", PSETI_QUABOS = "/app/ci/integration/configs", PSETI_LOGS = "/tmp/pseti_test/logs" }
-pre_run = "mkdir -p /tmp/pseti_test/integration_configs /tmp/pseti_test/tmp /tmp/pseti_test/logs && cp -rL /app/ci/integration/configs/direct/*.json /tmp/pseti_test/integration_configs/ && ln -sf /app/ci/integration/configs/quabo_uids_chaos.json /tmp/pseti_test/tmp/quabo_uids.json"

[suites.test-hw]
description = "Physical Hardware-Software (HITL) tests"
type = "test"
environment = "ucb"
requires_docker = true
container_tool = "podman"
profiles = ["headnode", "daqnode"]
service = "headnode-server"
test_dir = "ci/hardware-software/"
env = { PSETI_CONFIG = "/app/ci/hardware-software/configs", PSETI_QUABOS = "/app/quabos", PSETI_FIRMWARE = "/app/firmware", PSETI_TMP = "/app/ci/test_state/tmp", PSETI_LOGS = "/app/ci/test_state/logs" }
