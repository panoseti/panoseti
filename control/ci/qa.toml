# ── Global settings ──────────────────────────────────────────────────────────

[settings]
default_parallel = 4
project_prefix = "pseti"

# ── Physical Environments ────────────────────────────────────────────────────
[environments.ucb]
config_dir = "ci/hardware-software/configs"
compose_file = "ci/docker-compose.hw-sw.yml"

# ── Test Suites ──────────────────────────────────────────────────────────────

[suites.lint]
description = "Static analysis (Ruff + MyPy)"
type = "lint"
requires_docker = true
compose_file = "ci/docker-compose.unit.yml"
profiles = ["unit"]
service = "unit-test-runner"
tasks = { ruff = "uv run ruff check . --fix --color=always", mypy = "uv run mypy . --explicit-package-bases --color-output" }

[suites.unit]
description = "Tier 1: Parallel unit tests (Logic & Parsing)"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.unit.yml"
profiles = ["unit"]
service = "unit-test-runner"
test_dir = "ci/tier1_unit/"
parallel = true

[suites.logic]
description = "Tier 2: Subsystem logic (Isolated State, Mocked gRPC)"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.unit.yml"
profiles = ["unit"]
service = "unit-test-runner"
test_dir = "ci/tier2_logic/"
parallel = true

[suites.fleet]
description = "Tier 3: Distributed flows (Dynamic Fleets, Real gRPC)"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.integration.yml"
service = "int-tester"
test_dir = "ci/tier3_fleet/"
env = { DAQNODE_DIRECT_HOST = "${DAQ_NET_PREFIX}.10", DAQNODE2_HOST = "${DAQ_NET_PREFIX}.20", HEADNODE_HOST = "${HEAD_NET_PREFIX}.22", REDIS_HOST = "${HEAD_NET_PREFIX}.20", DAQNODE_GATEWAY_HOST = "${HEAD_NET_PREFIX}.254" }

[suites.chaos]
description = "Tier 4: Fault injection (Active failure scenarios)"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.integration.yml"
service = "int-tester"
test_dir = "ci/tier4_chaos/"
env = { ENABLE_TELEMETRY_TESTS = "1", DAQNODE_DIRECT_HOST = "${DAQ_NET_PREFIX}.10", DAQNODE2_HOST = "${DAQ_NET_PREFIX}.20", HEADNODE_HOST = "${HEAD_NET_PREFIX}.22", REDIS_HOST = "${HEAD_NET_PREFIX}.20", DAQNODE_GATEWAY_HOST = "${HEAD_NET_PREFIX}.254" }

[suites.test-hw]
description = "Physical Hardware-Software (HITL) tests"
type = "test"
environment = "ucb"
requires_docker = true
container_tool = "podman"
profiles = ["headnode", "daqnode"]
service = "headnode-server"
test_dir = "ci/hardware-software/"
env = { PSETI_CONFIG = "/app/ci/hardware-software/configs", PSETI_QUABOS = "/app/quabos", PSETI_FIRMWARE = "/app/firmware", PSETI_TMP = "/app/ci/test_state/tmp", PSETI_LOGS = "/app/ci/test_state/logs" }
