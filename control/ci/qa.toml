# ── Global settings ──────────────────────────────────────────────────────────

[settings]
default_parallel = 4
project_prefix = "pseti"

# ── Physical Environments ────────────────────────────────────────────────────
[environments.ucb]
config_dir = "ci/hardware-software/configs"
compose_file = "ci/docker-compose.hw-sw.yml"

# ── Test Suites ──────────────────────────────────────────────────────────────

[suites.lint]
description = "Static analysis (Ruff + MyPy)"
type = "lint"
requires_docker = true
compose_file = "ci/docker-compose.unit.yml"
profiles = ["unit"]
service = "unit-test-runner"
tasks = { ruff = "uv run ruff check . --fix --color=always", mypy = "uv run mypy . --explicit-package-bases --color-output" }

[suites.unit]
description = "Parallel unit tests"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.unit.yml"
profiles = ["unit"]
service = "unit-test-runner"
test_dir = "ci/unit/"
parallel = true

[suites.structural]
description = "Logical topology and network engine simulations"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.unit.yml"
profiles = ["unit"]
service = "unit-test-runner"
test_dir = "ci/structural/"

[suites.integration]
description = "E2E integration tests (excludes chaos scenarios)"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.integration.yml"
service = "int-tester"
test_dir = "ci/integration/"
pytest_args = ["--ignore=ci/integration/scenarios"]
env = { ENABLE_TELEMETRY_TESTS = "1", RUN_REAL_DATA_TESTS = "1", DAQNODE_CONTAINER_NAME = "pseti-integration-daqnode-1", PANOSETI_CONFIG_DIR = "/app/ci/integration/configs/direct", PANOSETI_TMP_DIR = "/app/ci/test_state/tmp", PANOSETI_QUABOS_DIR = "/app/ci/integration/configs", PANOSETI_LOGS_DIR = "/app/ci/test_state/logs" }
pre_run = "mkdir -p /app/ci/test_state/tmp && ln -sf /app/ci/integration/configs/quabo_uids_chaos.json /app/ci/test_state/tmp/quabo_uids.json"

[suites.chaos]
description = "Chaos/TDD-forcing scenario tests (expected to fail red on master)"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.integration.yml"
service = "int-tester"
test_dir = "ci/integration/scenarios/"
env = { ENABLE_TELEMETRY_TESTS = "1", RUN_REAL_DATA_TESTS = "1", DAQNODE_CONTAINER_NAME = "pseti-chaos-daqnode-1", PANOSETI_CONFIG_DIR = "/app/ci/integration/configs/direct", PANOSETI_TMP_DIR = "/app/ci/test_state/tmp", PANOSETI_QUABOS_DIR = "/app/ci/integration/configs", PANOSETI_LOGS_DIR = "/app/ci/test_state/logs" }
pre_run = "mkdir -p /app/ci/test_state/tmp && ln -sf /app/ci/integration/configs/quabo_uids_chaos.json /app/ci/test_state/tmp/quabo_uids.json"

[suites.test-hw]
description = "Physical Hardware-Software (HITL) tests"
type = "test"
environment = "ucb"
requires_docker = true
profiles = ["headnode", "daqnode"]
service = "headnode-server"
test_dir = "ci/hardware-software/"
env = { PANOSETI_CONFIG_DIR = "/app/ci/hardware-software/configs", PANOSETI_QUABOS_DIR = "/app/quabos", PANOSETI_FIRMWARE_DIR = "/app/firmware", PANOSETI_TMP_DIR = "/app/ci/test_state/tmp", PANOSETI_LOGS_DIR = "/app/ci/test_state/logs" }
