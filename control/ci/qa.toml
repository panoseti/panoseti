# ── Global settings ──────────────────────────────────────────────────────────

[settings]
default_parallel = 4
project_prefix = "pseti"

# ── Physical Environments ────────────────────────────────────────────────────
[environments.ucb]
config_dir = "ci/hardware-software/configs"
compose_file = "ci/docker-compose.hw-sw.yml"

# ── Test Suites ──────────────────────────────────────────────────────────────

[suites.lint]
description = "Static analysis (Ruff + MyPy)"
type = "lint"
requires_docker = true
compose_file = "ci/docker-compose.unit.yml"
profiles = ["unit"]
service = "unit-test-runner"
tasks = { ruff = "uv run ruff check . --fix --color=always", mypy = "uv run mypy . --explicit-package-bases --color-output" }

[suites.unit]
description = "Parallel unit tests"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.unit.yml"
profiles = ["unit"]
service = "unit-test-runner"
test_dir = "ci/unit/"
parallel = true

[suites.structural]
description = "Logical topology and network engine simulations"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.unit.yml"
profiles = ["unit"]
service = "unit-test-runner"
test_dir = "ci/structural/"

[suites.integration]
description = "E2E integration tests (excludes chaos scenarios)"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.integration.yml"
service = "int-tester"
test_dir = "ci/integration/"
pytest_args = ["--ignore=ci/integration/scenarios"]
env = { HEAD_NET_PREFIX = "10.0.1", DAQ_NET_PREFIX = "192.168.0", QUABO_NET_PREFIX = "192.168.3", ENABLE_TELEMETRY_TESTS = "1", RUN_REAL_DATA_TESTS = "1", DAQNODE_CONTAINER_NAME = "pseti-integration-daqnode-1", PSETI_CONFIG = "/app/ci/integration/configs/direct", PSETI_TMP = "/app/ci/test_state/tmp", PSETI_QUABOS = "/app/ci/integration/configs", PSETI_LOGS = "/app/ci/test_state/logs" }
pre_run = "mkdir -p /app/ci/test_state/tmp && ln -sf /app/ci/integration/configs/quabo_uids_chaos.json /app/ci/test_state/tmp/quabo_uids.json"

[suites.chaos]
description = "Chaos/TDD-forcing scenario tests (expected to fail red on master)"
type = "test"
requires_docker = true
compose_file = "ci/docker-compose.integration.yml"
service = "int-tester"
test_dir = "ci/integration/scenarios/"
env = { HEAD_NET_PREFIX = "10.0.2", DAQ_NET_PREFIX = "192.168.1", QUABO_NET_PREFIX = "192.168.4", ENABLE_TELEMETRY_TESTS = "1", RUN_REAL_DATA_TESTS = "1", DAQNODE_CONTAINER_NAME = "pseti-chaos-daqnode-1", PSETI_CONFIG = "/app/ci/integration/configs/chaos", PSETI_TMP = "/app/ci/test_state/tmp", PSETI_QUABOS = "/app/ci/integration/configs/chaos", PSETI_LOGS = "/app/ci/test_state/logs" }
pre_run = "mkdir -p /app/ci/integration/configs/chaos && for f in /app/ci/integration/configs/direct/*.json; do cp \"$f\" \"/app/ci/integration/configs/chaos/$(basename \"$f\")\"; done && sed -i 's/10\\.0\\.1/10.0.2/g' /app/ci/integration/configs/chaos/*.json && sed -i 's/192\\.168\\.0/192.168.1/g' /app/ci/integration/configs/chaos/*.json && sed -i 's/192\\.168\\.3/192.168.4/g' /app/ci/integration/configs/chaos/*.json && cp /app/ci/integration/configs/quabo_uids_chaos.json /app/ci/integration/configs/chaos/quabo_uids.json && sed -i 's/192\\.168\\.3/192.168.4/g' /app/ci/integration/configs/chaos/quabo_uids.json && mkdir -p /app/ci/test_state/tmp && ln -sf /app/ci/integration/configs/chaos/quabo_uids.json /app/ci/test_state/tmp/quabo_uids.json"

[suites.test-hw]
description = "Physical Hardware-Software (HITL) tests"
type = "test"
environment = "ucb"
requires_docker = true
profiles = ["headnode", "daqnode"]
service = "headnode-server"
test_dir = "ci/hardware-software/"
env = { PSETI_CONFIG = "/app/ci/hardware-software/configs", PSETI_QUABOS = "/app/quabos", PSETI_FIRMWARE = "/app/firmware", PSETI_TMP = "/app/ci/test_state/tmp", PSETI_LOGS = "/app/ci/test_state/logs" }
