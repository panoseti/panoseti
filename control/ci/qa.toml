# ── Global settings ──────────────────────────────────────────────────────────

[settings]
default_parallel = 4

# ── Infrastructure tasks ──────────────────────────────────────────────────────

[infra.up_unit]
command     = "docker compose --env-file .env.ci -f ci/docker-compose.unit.yml --profile unit up -d"
description = "Start unit/lint test stack"

[infra.down_unit]
command     = "docker compose --env-file .env.ci -f ci/docker-compose.unit.yml --profile unit down -v"
description = "Tear down unit/lint stack and volumes"

[infra.up_integration]
command     = "docker compose --env-file .env.ci -f ci/docker-compose.integration.yml up -d"
description = "Start integration test stack"

[infra.down_integration]
command     = "docker compose --env-file .env.ci -f ci/docker-compose.integration.yml down -v"
description = "Tear down integration stack and volumes"

[infra.build]
command     = "docker compose --env-file .env.ci -f ci/docker-compose.unit.yml --profile unit build && docker compose --env-file .env.ci -f ci/docker-compose.integration.yml build"
description = "Rebuild all test images"

# ── Lint tasks ───────────────────────────────────────────────────────────────
# All lint tasks run concurrently. Output lines are prefixed with the task name.

[lint.ruff]
command     = "docker compose --env-file .env.ci -f ci/docker-compose.unit.yml --profile unit exec -T unit-test-runner uv run ruff check . --fix --color=always"
description = "Ruff lint + autofix"

[lint.mypy]
command     = "docker compose --env-file .env.ci -f ci/docker-compose.unit.yml --profile unit exec -T unit-test-runner uv run mypy . --explicit-package-bases --color-output"
description = "MyPy static type check"

# ── Test tasks ────────────────────────────────────────────────────────────────
# Sequential. {parallel} is substituted from --jobs / settings.default_parallel.

[test.unit]
command     = "docker compose --env-file .env.ci -f ci/docker-compose.unit.yml --profile unit exec -T unit-test-runner pytest ci/unit/ -v -n {parallel} --color=yes {args}"
description = "Parallel unit tests (pytest-xdist)"

[test.structural]
command     = "docker compose --env-file .env.ci -f ci/docker-compose.unit.yml --profile unit exec -T unit-test-runner pytest ci/structural/ -v --color=yes {args}"
description = "Logical topology and network engine simulations"

[test.integration]
command     = "docker compose --env-file .env.ci -f ci/docker-compose.integration.yml exec -T -e PANOSETI_CONFIG_DIR=/app/ci/integration/configs/direct -e PANOSETI_TMP_DIR=/app/ci/test_state/tmp -e PANOSETI_QUABOS_DIR=/app/ci/integration/configs -e PANOSETI_LOGS_DIR=/app/ci/test_state/logs int-tester /bin/sh -c 'mkdir -p /app/ci/test_state/tmp && ln -sf /app/ci/integration/configs/quabo_uids_chaos.json /app/ci/test_state/tmp/quabo_uids.json && pytest ci/integration/ -v --color=yes --ignore=ci/integration/scenarios {args}'"
description = "E2E integration tests (excludes chaos scenarios)"

[test.chaos]
command     = "docker compose --env-file .env.ci -f ci/docker-compose.integration.yml exec -T -e ENABLE_TELEMETRY_TESTS=1 -e PANOSETI_CONFIG_DIR=/app/ci/integration/configs/direct -e PANOSETI_TMP_DIR=/app/ci/test_state/tmp -e PANOSETI_QUABOS_DIR=/app/ci/integration/configs -e PANOSETI_LOGS_DIR=/app/ci/test_state/logs int-tester /bin/sh -c 'mkdir -p /app/ci/test_state/tmp && ln -sf /app/ci/integration/configs/quabo_uids_chaos.json /app/ci/test_state/tmp/quabo_uids.json && pytest ci/integration/scenarios/ -v --color=yes {args}'"
description = "Chaos/TDD-forcing scenario tests (expected to fail red on master)"
