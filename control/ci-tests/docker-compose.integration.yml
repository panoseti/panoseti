networks:
  headnode_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.1.0/24
  daqnode_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/24

volumes:
  daq_data:
  daq_data_2:

services:

  redis:
    image: redis:7-alpine
    networks:
      headnode_net:
        ipv4_address: 10.0.1.20
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 10

  loki:
    image: grafana/loki:3.7.0
    networks:
      headnode_net:
        ipv4_address: 10.0.1.21

  gateway:
    image: alpine/socat
    networks:
      headnode_net:
        ipv4_address: ${DAQNODE_GATEWAY_HOST}
      daqnode_net:
        ipv4_address: 192.168.0.254
    volumes:
      - ./integration/build/gateway_setup.sh:/gateway_setup.sh:ro
    entrypoint: ["sh", "/gateway_setup.sh"]
    environment:
      DAQNODE_IP: "${DAQNODE_DIRECT_HOST}"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${GRPC_PORT} || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s

  headnode:
    build:
      context: ../
      dockerfile: ci-tests/Dockerfile.ci
      target: integration-headnode
    networks:
      headnode_net:
        ipv4_address: ${HEADNODE_HOST}
    volumes:
      - ..:/app
    environment:
      REDIS_HOST: "${REDIS_HOST}"
      LOKI_URL:   "${LOKI_URL}"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      redis:
        condition: service_started
      loki:
        condition: service_started
    command: >
      /bin/sh -c "panoseti-server --config /app/ci-tests/integration/configs/headnode/server.toml &
      exec python daemons/storeLoki.py"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',${GRPC_PORT})); s.close()\" 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  daqnode:
    build:
      context: ../
      dockerfile: ci-tests/Dockerfile.ci
      target: integration-daqnode
    networks:
      headnode_net:
        ipv4_address: 10.0.1.10
      daqnode_net:
        ipv4_address: ${DAQNODE_DIRECT_HOST}
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - IPC_LOCK
      - SYS_NICE
    shm_size: '1gb'
    volumes:
      - daq_data:/data
      - ..:/app
    environment:
      GRPC_PORT:          "${GRPC_PORT}"
      BINDHOST:           "${BINDHOST}"
      HEADNODE_IP:        "${HEADNODE_HOST}"
      HEADNODE_GRPC_PORT: "${GRPC_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',${GRPC_PORT})); s.close()\" 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  daqnode-2:
    build:
      context: ../
      dockerfile: ci-tests/Dockerfile.ci
      target: integration-daqnode
    networks:
      headnode_net:
        ipv4_address: 10.0.1.11
      daqnode_net:
        ipv4_address: ${DAQNODE2_HOST}
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - IPC_LOCK
      - SYS_NICE
    shm_size: '1gb'
    volumes:
      - daq_data_2:/data
      - ..:/app
    environment:
      GRPC_PORT:          "${GRPC_PORT}"
      BINDHOST:           "${BINDHOST}"
      HEADNODE_IP:        "${HEADNODE_HOST}"
      HEADNODE_GRPC_PORT: "${GRPC_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',${GRPC_PORT})); s.close()\" 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  int-tester:
    build:
      context: ../
      dockerfile: ci-tests/Dockerfile.ci
      target: integration-headnode
    networks:
      headnode_net:
        ipv4_address: 10.0.1.5
      daqnode_net:
        ipv4_address: 192.168.0.5
    volumes:
      - daq_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/app
    environment:
      DAQNODE_DIRECT_HOST:    "${DAQNODE_DIRECT_HOST}"
      DAQNODE_GATEWAY_HOST:   "${DAQNODE_GATEWAY_HOST}"
      DAQNODE_DATA_HOST:      "${DAQNODE_DATA_HOST}"
      DAQNODE2_HOST:          "${DAQNODE2_HOST}"
      HEADNODE_HOST:          "${HEADNODE_HOST}"
      BINDHOST:               "${BINDHOST}"
      GRPC_PORT:              "${GRPC_PORT}"
      LOKI_URL:               "${LOKI_URL}"
      REDIS_HOST:             "${REDIS_HOST}"
      DAQ_DATA_DIR:           "/data"
      HEAD_DATA_DIR:          "/data/head"
      DAQNODE_CONTAINER_NAME: "ctl-int-daqnode-1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      daqnode:
        condition: service_healthy
      daqnode-2:
        condition: service_healthy
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_started
      headnode:
        condition: service_healthy
    command: ["sleep", "infinity"]
