# docker-compose.integration.yml — PANOSETI end-to-end integration test environment.
#
# Topology (simulating Palomar-like VPN gateway):
#
#   headnode_net (10.0.1.0/24):
#     test-runner (10.0.1.5)   — runs pytest integration suite
#     gateway     (10.0.1.1)   — socat TCP bridge to daqnode_net
#     redis       (10.0.1.20)  — for log/telemetry pipeline tests
#     loki        (10.0.1.21)  — for storeLoki.py tests
#
#   daqnode_net (192.168.0.0/24):
#     daqnode     (192.168.0.10) — daq_control + daq_data gRPC servers + fake hashpipe
#     gateway     (192.168.0.254)  — socat bridge (same container, two NICs)
#
# Environment variables for hardware CI override:
#   DAQNODE_DIRECT_HOST   — direct IP of real DAQ node (default: 192.168.0.10)
#   DAQNODE_GATEWAY_HOST  — gateway IP for forwarded access (default: 10.0.1.254)
#   GRPC_PORT             — gRPC port (default: 50051)

networks:
  headnode_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.1.0/24
  daqnode_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/24

volumes:
  daq_data:        # shared between daqnode (192.168.0.10) and test-runner for data collection tests
  daq_data_2:      # private volume for daqnode-2 (192.168.0.20) — isolated to avoid module.config conflicts
  hashpipe_uds:    # hashpipe UDS sockets shared between daqnode and daqnode-daqdata-snoop (real-data tests)
  hashpipe_uds_2:

services:

  # ---------------------------------------------------------------------------
  # Redis — telemetry log queue + storeLoki pipeline
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    networks:
      headnode_net:
        ipv4_address: 10.0.1.20
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Loki — log aggregation (storeLoki ships logs here)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.0  # Bump to 3.7.0 or newer
    networks:
      headnode_net:
        ipv4_address: 10.0.1.21
    command: ["-config.file=/etc/loki/local-config.yaml"]
    healthcheck:
      # Use the new built-in health flag; bypasses the missing shell
      test: ["CMD", "loki", "-health"]
      interval: 5s
      timeout: 3s
      retries: 12
      # start_period: 20s

  # ---------------------------------------------------------------------------
  # Gateway — socat TCP bridge simulating a NAT/VPN router
  # ---------------------------------------------------------------------------
  gateway:
    image: alpine/socat
    networks:
      headnode_net:
        ipv4_address: 10.0.1.254
      daqnode_net:
        ipv4_address: 192.168.0.254
    volumes:
      - ./integration/build/gateway_setup.sh:/gateway_setup.sh:ro
    entrypoint: ["sh", "/gateway_setup.sh"]
    environment:
      DAQNODE_IP: "192.168.0.10"
    depends_on:
      daqnode:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # DAQ Data node — runs only the daq_data gRPC server (port 50051).
  # Separate from daqnode so each server owns its own port 50051 on its IP.
  # For real-data tests (RUN_REAL_DATA_TESTS=1) the hashpipe_uds volume
  # provides access to the UDS sockets created by hashpipe on daqnode.
  # ---------------------------------------------------------------------------
  daqnode-daqdata-snoop:
    build:
      context: ../
      dockerfile: ci-tests/Dockerfile.ci
      target: integration-daqdata
    networks:
      daqnode_net:
        ipv4_address: 192.168.0.11
    volumes:
      - daq_data:/data
      - hashpipe_uds:/tmp              # UDS sockets from daqnode's hashpipe process
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',50051)); s.close()\" 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # DAQ node — runs daq_control gRPC server + real hashpipe binary
  # daq_data gRPC server runs separately on daqnode-daqdata-snoop (192.168.0.11)
  # ---------------------------------------------------------------------------
  daqnode:
    build:
      context: ../                     # build context = control/
      dockerfile: ci-tests/Dockerfile.ci
      target: integration-daqnode
    networks:
      daqnode_net:
        ipv4_address: 192.168.0.10
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - IPC_LOCK
      - SYS_NICE
    shm_size: '2gb'
    volumes:
      - daq_data:/data
      - hashpipe_uds:/tmp              # hashpipe UDS sockets visible to daqnode-daqdata-snoop
    environment:
      GRPC_PORT: "50051"
      DATA_PORT: "50052"
    healthcheck:
      # Wait until the daq_control gRPC port is open
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',50051)); s.close()\" 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s


  # ---------------------------------------------------------------------------
  # Second DAQ node — for two-node integration tests.
  # Runs daq_control only; mirrors daqnode on 192.168.0.20.
  # ---------------------------------------------------------------------------
  daqnode-2:
    build:
      context: ../
      dockerfile: ci-tests/Dockerfile.ci
      target: integration-daqnode
    networks:
      daqnode_net:
        ipv4_address: 192.168.0.20
    cap_add:
      - NET_RAW        # Allows AF_PACKET raw sockets for pktsock
      - NET_ADMIN      # Allows network interface binding/promiscuous mode
      - IPC_LOCK       # Allows locking shared memory into RAM (mlock)
      - SYS_NICE       # Allows Hashpipe to set real-time thread priorities
    shm_size: '2gb'    # Overrides 64MB default to support Hashpipe's 1GB ring buffers
    volumes:
      - daq_data_2:/data   # private volume — prevents module.config conflicts with daqnode
      # - hashpipe_uds_2:/tmp # Give this daq node a private /tmp directory to avoid uds issues
    environment:
      GRPC_PORT: "50051"
      BINDHOST: "lo"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',50051)); s.close()\" 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # storeLoki — Redis→Loki log-shipping daemon (for test_loki_pipeline.py)
  # ---------------------------------------------------------------------------
  storeloki:
    build:
      context: ../                     # build context = control/
      dockerfile: ci-tests/Dockerfile.ci
      target: integration-headnode
    networks:
      headnode_net:
        ipv4_address: 10.0.1.22
    environment:
      REDIS_HOST: "10.0.1.20"
      LOKI_URL:   "http://10.0.1.21:3100"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      redis:
        condition: service_healthy
      # loki:
      #   condition: service_healthy
    command: >
      python daemons/storeLoki.py
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import redis; r=redis.Redis(host='10.0.1.20'); r.ping()\" 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Test runner — runs pytest tests/integration/
  # ---------------------------------------------------------------------------
  integration-test-runner:
    build:
      context: ../                     # build context = control/
      dockerfile: ci-tests/Dockerfile.ci
      target: integration-headnode
    networks:
      headnode_net:
        ipv4_address: 10.0.1.5
      daqnode_net:
        ipv4_address: 192.168.0.5
    volumes:
      - daq_data:/data                 # shared with daqnode for data collection tests
      - /var/run/docker.sock:/var/run/docker.sock  # for container pause/unpause tests
    environment:
      DAQNODE_DIRECT_HOST:   "${DAQNODE_DIRECT_HOST:-192.168.0.10}"
      DAQNODE_GATEWAY_HOST:  "${DAQNODE_GATEWAY_HOST:-10.0.1.254}"
      DAQNODE_DATA_HOST:     "${DAQNODE_DATA_HOST:-192.168.0.11}"
      DAQNODE2_HOST:         "${DAQNODE2_HOST:-192.168.0.20}"
      BINDHOST:              "${BINDHOST:-lo}"
      GRPC_PORT:             "${GRPC_PORT:-50051}"
      LOKI_URL:              "http://10.0.1.21:3100"
      REDIS_HOST:            "10.0.1.20"
      DAQ_DATA_DIR:          "/data"
      HEAD_DATA_DIR:         "/data/head"
      DAQNODE_CONTAINER_NAME: "ctl-int-daqnode-1"
      PYTHONDONTWRITEBYTECODE: "1"
      RUN_REAL_DATA_TESTS:    0
    depends_on:
      daqnode:
        condition: service_healthy
      daqnode-daqdata-snoop:
        condition: service_healthy
      daqnode-2:
        condition: service_healthy
      gateway:
        condition: service_started
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy
      storeloki:
        condition: service_healthy
    command: >
      pytest ci-tests/integration/ -v --tb=short --color=yes
        -p no:cacheprovider
        --timeout=60
