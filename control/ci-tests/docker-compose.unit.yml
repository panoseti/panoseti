services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  unit-test-runner:
    build:
      context: ..
      dockerfile: ci-tests/Dockerfile.ci
      target: unit-test-runner
    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # Mount repo for live edits during local development
      - ..:/app
    working_dir: /app
    # Keeps container running in the background for `qa.py` execution
    command: ["sleep", "infinity"]
    profiles:
      - unit
