# ── Global settings ──────────────────────────────────────────────────────────

[settings]
default_parallel = 4

# ── Infrastructure tasks ──────────────────────────────────────────────────────

[infra.up]
command     = "docker compose --env-file .env -f ci-tests/docker-compose.unit.yml --profile unit up -d && docker compose --env-file .env -f ci-tests/docker-compose.integration.yml up -d"
description = "Start all background test containers"

[infra.down]
command     = "docker compose --env-file .env -f ci-tests/docker-compose.unit.yml --profile unit down && docker compose --env-file .env -f ci-tests/docker-compose.integration.yml down"
description = "Tear down all test containers"

[infra.build]
command     = "docker compose --env-file .env -f ci-tests/docker-compose.unit.yml --profile unit build && docker compose --env-file .env -f ci-tests/docker-compose.integration.yml build"
description = "Rebuild all test images"

[infra.restart]
command     = "docker compose --env-file .env -f ci-tests/docker-compose.unit.yml --profile unit restart && docker compose --env-file .env -f ci-tests/docker-compose.integration.yml restart"
description = "Restart all test containers"

# ── Lint tasks ───────────────────────────────────────────────────────────────
# All lint tasks run concurrently. Output lines are prefixed with the task name.

[lint.ruff]
command     = "docker compose --env-file .env -f ci-tests/docker-compose.unit.yml --profile unit exec -T unit-test-runner uv run ruff check . --fix --color=always"
description = "Ruff lint + autofix"

[lint.mypy]
command     = "docker compose --env-file .env -f ci-tests/docker-compose.unit.yml --profile unit exec -T unit-test-runner uv run mypy . --color-output"
description = "MyPy static type check"

# ── Test tasks ────────────────────────────────────────────────────────────────
# Sequential. {parallel} is substituted from --jobs / settings.default_parallel.

[test.unit]
command     = "docker compose --env-file .env -f ci-tests/docker-compose.unit.yml --profile unit exec -T unit-test-runner pytest ci-tests/unit/ -v -n {parallel} --color=yes {args}"
description = "Parallel unit tests (pytest-xdist)"

[test.integration]
command     = "docker compose --env-file .env -f ci-tests/docker-compose.integration.yml exec -T int-tester pytest ci-tests/integration/ -v --color=yes {args}"
description = "E2E integration tests"
