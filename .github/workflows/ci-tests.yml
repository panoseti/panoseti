name: CI Tests

on:
  push:
    branches: [master, dev, claude-refactor, phase-2-robustness-and-driver-tests]
    paths:
      - 'control/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, dev, mount-metadata, claude-refactor, phase-2-robustness-and-driver-tests]
    paths:
      - 'control/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Global BuildKit cache configuration for Compose
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # 1. Warm up the base cache. This avoids redundant building in parallel jobs.
  prepare-base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and Cache Base Stages
        uses: docker/build-push-action@v5
        with:
          context: control
          file: control/ci/Dockerfile.ci
          target: base
          push: false
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  # 2. Run Lint and Unit tests together. They share the same image and setup.
  lint-and-unit:
    needs: prepare-base
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Use the warmed base cache
      # We allow access to '..' because docker-compose.unit.yml sets context: ..
      - name: Build unit-test image
        run: |
          docker buildx bake \
            --allow fs.read=.. \
            -f ci/docker-compose.unit.yml \
            --set *.cache-from=type=gha,scope=base \
            --set *.cache-to=type=gha,mode=max,scope=unit \
            unit-test-runner
        working-directory: control

      - name: Run Linting
        run: python3 ci/qa.py lint
        working-directory: control

      - name: Run Unit Tests
        run: python3 ci/qa.py unit
        working-directory: control

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-pytest-cache
          path: control/.pytest_cache/
          if-no-files-found: ignore

  # 3. Integration tests run in parallel with unit tests
  integration-tests:
    needs: prepare-base
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # We allow access to '..' because docker-compose.integration.yml sets context: ..
      - name: Build Integration Stack
        run: |
          docker buildx bake \
            --allow fs.read=.. \
            -f ci/docker-compose.integration.yml \
            --set *.cache-from=type=gha,scope=base \
            --set *.cache-to=type=gha,mode=max,scope=integration
        working-directory: control

      - name: Run Integration Tests
        run: python3 ci/qa.py integration
        working-directory: control

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: control/.pytest_cache/
          if-no-files-found: ignore
