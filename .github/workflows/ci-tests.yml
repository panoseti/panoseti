name: CI Tests

on:
  push:
    branches: [master, dev, test-hw-sw, claude-refactor, phase-2-robustness-and-driver-tests, add-linting]
    paths:
      - 'control/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, dev]
    paths:
      - 'control/**'

jobs:
  # 1. Warm up the base cache.
  prepare-base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Initialize required submodules
        run: git submodule update --init grpc grafana

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and Cache Base Stage
        uses: docker/build-push-action@v5
        with:
          context: .
          file: control/ci/Dockerfile.ci
          target: base
          push: false
          load: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  # 2. Run Unit, Structural, and Lint tests together in a single job/container.
  # This is much faster than spinning up 3 separate environments.
  fast-validation:
    needs: prepare-base
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize required submodules
        run: git submodule update --init grpc grafana

      - name: Load .env.ci into GitHub environment
        run: grep -v '^#' control/ci/.env.ci >> $GITHUB_ENV

      - name: Install uv and sync host dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --all-extras
        working-directory: control

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Test Runner
        run: |
          docker buildx bake \
            -f control/ci/docker-compose.unit.yml \
            --set *.context=. \
            --set *.dockerfile=control/ci/Dockerfile.ci \
            --set *.cache-from=type=gha,scope=base \
            --load \
            unit-test-runner

      - name: Run Unit Tests
        run: PYTHONPATH=src uv run python3 -m control.pseti sw-test --no-build unit
        working-directory: control

      - name: Run Structural Tests
        run: PYTHONPATH=src uv run python3 -m control.pseti sw-test --no-build structural
        working-directory: control

      - name: Run Linting
        run: PYTHONPATH=src uv run python3 -m control.pseti sw-test --no-build lint
        working-directory: control

  # 3. Integration Tests
  integration-tests:
    needs: prepare-base
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize required submodules
        run: git submodule update --init grpc grafana

      - name: Load .env.ci into GitHub environment
        run: grep -v '^#' control/ci/.env.ci >> $GITHUB_ENV

      - name: Install uv and sync host dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --all-extras
        working-directory: control

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Integration Stack
        run: |
          docker buildx bake \
            -f control/ci/docker-compose.integration.yml \
            --set *.context=. \
            --set *.dockerfile=control/ci/Dockerfile.ci \
            --set *.cache-from=type=gha,scope=base \
            --load

      - name: Run Integration Tests
        run: PYTHONPATH=src uv run python3 -m control.pseti sw-test --no-build integration
        working-directory: control

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: control/.pytest_cache/
          if-no-files-found: ignore
