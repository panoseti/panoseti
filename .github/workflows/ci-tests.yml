name: CI Tests

on:
  push:
    branches: [master, dev, claude-refactor, phase-2-robustness-and-driver-tests]
    paths:
      - 'control/**'
      - '.github/workflows/ci-tests.yml'
  pull_request:
    branches: [master, dev, mount-metadata, claude-refactor, phase-2-robustness-and-driver-tests]
    paths:
      - 'control/**'

# Cancel in-progress runs if new commits are pushed to the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # Failsafe against hanging containers

    steps:
      - uses: actions/checkout@v4

      # 1. Setup Docker Buildx for advanced layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Expose the caching mechanisms to docker-compose
      - name: Enable Docker BuildKit Cache
        run: |
          echo "BUILDKIT_INLINE_CACHE=1" >> $GITHUB_ENV
          echo "COMPOSE_BAKE=true" >> $GITHUB_ENV

      - name: Run unit tests via Docker
        run: bash ci-tests/run.sh unit
        working-directory: control

      # Upload raw cache/logs for deep debugging
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-pytest-artifacts
          path: control/.pytest_cache/
          if-no-files-found: ignore

  integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # Integration tests usually need a bit more time

    steps:
      - uses: actions/checkout@v4

      # 1. Setup Docker Buildx for advanced layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Expose the caching mechanisms to docker-compose
      - name: Enable Docker BuildKit Cache
        run: |
          echo "BUILDKIT_INLINE_CACHE=1" >> $GITHUB_ENV
          echo "COMPOSE_BAKE=true" >> $GITHUB_ENV

      - name: Run integration tests via Docker
        run: bash ci-tests/run.sh integration
        working-directory: control

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-pytest-artifacts
          path: control/.pytest_cache/
          if-no-files-found: ignore