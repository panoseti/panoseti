  # 4. Hardware Tests (HITL) — runs on self-hosted runner with real Quabos
  hardware-software-tests:
    needs: prepare-base
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Initialize submodules
        run: git submodule update --init grpc grafana pypff

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Prepare Workspace
        run: mkdir -p state .pytest_cache
        working-directory: control

      - name: Build/Install local pseti package
        run: uv sync --all-extras
        working-directory: control

      - name: Orchestrate HITL Sequence
        run: uv run python3 src/ci/hw_ci_orchestrator.py --no-fail-fast
        working-directory: control
        env:
          PSETI_CONTROL_BUILD: "."
          PSETI_ROOT_BUILD: ".."
