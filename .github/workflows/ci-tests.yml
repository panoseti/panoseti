name: CI Tests

on:
  push:
    branches: [master, dev, test-hw-sw, claude-refactor, phase-2-robustness-and-driver-tests, add-linting]
    paths:
      - 'control/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, dev]
    paths:
      - 'control/**'

jobs:
  # 1. Warm up the base cache and pre-bake test images.
  prepare-base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Initialize required submodules
        run: git submodule update --init grpc grafana

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and Cache Base and Test Images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: control/ci/Dockerfile.ci
          target: base
          push: false
          load: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Pre-bake Test Runner
        uses: docker/build-push-action@v5
        with:
          context: .
          file: control/ci/Dockerfile.ci
          target: test-runner
          push: false
          load: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=test-runner

  # 2. Run Unit and Lint tests sequentially in the same job/container.
  unit-and-lint:
    needs: prepare-base
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize required submodules
        run: git submodule update --init grpc grafana

      - name: Load .env.ci into GitHub environment
        run: grep -v '^#' control/ci/.env.ci >> $GITHUB_ENV

      - name: Install uv and sync host dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --all-extras
        working-directory: control

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Restore Test Runner
        uses: docker/build-push-action@v5
        with:
          context: .
          file: control/ci/Dockerfile.ci
          target: test-runner
          push: false
          load: true
          cache-from: type=gha,scope=test-runner

      - name: Run Unit Tests
        run: PYTHONPATH=src uv run python3 -m control.pseti sw-test --no-build unit
        working-directory: control

      - name: Run Linting
        run: PYTHONPATH=src uv run python3 -m control.pseti sw-test --no-build lint
        working-directory: control

  # 3. Integration Tests
  integration-tests:
    needs: prepare-base
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize required submodules
        run: git submodule update --init grpc grafana

      - name: Load .env.ci into GitHub environment
        run: grep -v '^#' control/ci/.env.ci >> $GITHUB_ENV

      - name: Install uv and sync host dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --all-extras
        working-directory: control

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Test Runner
        uses: docker/build-push-action@v5
        with:
          context: .
          file: control/ci/Dockerfile.ci
          target: test-runner
          push: false
          load: true
          cache-from: type=gha,scope=test-runner

      - name: Pre-bake DAQ Node
        uses: docker/build-push-action@v5
        with:
          context: .
          file: control/ci/Dockerfile.ci
          target: integration-daqnode
          push: false
          load: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=daqnode

      - name: Run Integration Tests
        run: PYTHONPATH=src uv run python3 -m control.pseti sw-test --no-build integration
        working-directory: control

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: control/.pytest_cache/
          if-no-files-found: ignore
