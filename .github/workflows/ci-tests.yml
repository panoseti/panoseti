name: CI Tests

on:
  push:
    branches: [master, dev, test-hw-sw, claude-refactor, phase-2-robustness-and-driver-tests, add-linting]
    paths:
      - 'control/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, dev]
    paths:
      - 'control/**'

jobs:
  # 1. Warm up the base cache.
  prepare-base:
    # runs-on: ubuntu-24.04
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Initialize required submodules
        run: git submodule update --init grpc grafana
      
      - name: Load .env.ci into GitHub environment
        run: grep -v '^#' control/ci/.env.ci >> $GITHUB_ENV
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install host dependencies
        run: uv sync --all-extras
        working-directory: control

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Pre-build and Cache All Test Images
        run: |
          BUILDX_BAKE_ENTITLEMENTS_FS=0 docker buildx bake \
            -f control/ci/docker-compose.integration.yml \
            --pull=false \
            --set *.context=. \
            --set *.cache-from=type=gha,scope=pseti-ci \
            --set *.cache-to=type=gha,mode=max,scope=pseti-ci

  # 2. Run Unit, Structural, and Lint tests together in a single job/container.
  fast-validation:
    needs: prepare-base
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize required submodules
        run: git submodule update --init grpc grafana

      - name: Load .env.ci into GitHub environment
        run: grep -v '^#' control/ci/.env.ci >> $GITHUB_ENV

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install host dependencies
        run: uv sync --all-extras
        working-directory: control

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and Load Test Runner
        run: |
          BUILDX_BAKE_ENTITLEMENTS_FS=0 docker buildx bake \
            -f control/ci/docker-compose.unit.yml \
            --pull=false \
            --set *.context=. \
            --set *.cache-from=type=gha,scope=pseti-ci \
            --load \
            unit-test-runner

      - name: Run Unit Tests
        run: PYTHONPATH=src uv run python3 -m control.pseti test --no-build sw unit
        working-directory: control

      - name: Run Structural Tests
        run: PYTHONPATH=src uv run python3 -m control.pseti test --no-build sw structural
        working-directory: control

      - name: Run Linting
        run: PYTHONPATH=src uv run python3 -m control.pseti test --no-build lint all
        working-directory: control

  # 3. Integration Tests
  integration-tests:
    needs: prepare-base
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize required submodules
        run: git submodule update --init grpc grafana

      - name: Load .env.ci into GitHub environment
        run: grep -v '^#' control/ci/.env.ci >> $GITHUB_ENV

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install host dependencies
        run: uv sync --all-extras
        working-directory: control

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Load Integration Stack
        run: |
          BUILDX_BAKE_ENTITLEMENTS_FS=0 docker buildx bake \
            -f control/ci/docker-compose.integration.yml \
            --pull=false \
            --set *.context=. \
            --set *.cache-from=type=gha,scope=pseti-ci \
            --load

      - name: Run Integration Tests
        run: PYTHONPATH=src uv run python3 -m control.pseti test --no-build sw integration
        working-directory: control

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: control/.pytest_cache/
          if-no-files-found: ignore
