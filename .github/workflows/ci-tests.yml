name: CI Tests

on:
  push:
    branches: [master, dev, test-hw-sw, claude-refactor, phase-2-robustness-and-driver-tests, add-linting, test-pseti]
    paths:
      - 'control/**'
      - '.github/workflows/ci-tests.yml'
  pull_request:
    branches: [master, dev, test-pseti]
    paths:
      - 'control/**'

jobs:
  # 1. Warm up the base cache.
  prepare-base:
    # runs-on: ubuntu-24.04
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Initialize required submodules
        run: git submodule update --init grpc grafana
      
      - name: Load .env.ci into GitHub environment
        run: grep -v '^#' control/src/ci/.env.ci >> $GITHUB_ENV
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install host dependencies
        run: uv sync --all-extras
        working-directory: control

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Pre-build and Cache All Test Images
        run: |
          BUILDX_BAKE_ENTITLEMENTS_FS=0 docker buildx bake \
            -f control/src/ci/docker-compose.integration.yml \
            --pull=false \
            --set *.context=. \
            --set *.cache-from=type=gha,scope=pseti-ci \
            --set *.cache-to=type=gha,mode=max,scope=pseti-ci

  # 2. Software Tests (Matrix for Parallelism)
  software-tests:
    needs: prepare-base
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tier: ["lint all", "sw unit", "sw logic", "sw fleet", "sw chaos", "sw integration"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize required submodules
        run: git submodule update --init grpc grafana

      - name: Load .env.ci into GitHub environment
        run: grep -v '^#' control/src/ci/.env.ci >> $GITHUB_ENV

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install host dependencies
        run: uv sync --all-extras
        working-directory: control

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build/Load Images (Tier-specific)
        run: |
          if [[ "${{ matrix.tier }}" == *"unit"* ]]; then
             compose_file="control/src/ci/docker-compose.unit.yml"
          else
             compose_file="control/src/ci/docker-compose.integration.yml"
          fi
          BUILDX_BAKE_ENTITLEMENTS_FS=0 docker buildx bake \
            -f $compose_file \
            --pull=false \
            --set *.context=. \
            --set *.cache-from=type=gha,scope=pseti-ci \
            --load

      - name: Run Test Tier
        run: uv run pseti test --no-build ${{ matrix.tier }}
        working-directory: control

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.tier }}
          path: control/.pytest_cache/
          if-no-files-found: ignore

  # 3. Hardware Tests (HITL)
  hardware-software-tests:
    needs: prepare-base
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize submodules
        run: git submodule update --init grpc grafana

      - name: Load .env.ci
        run: grep -v '^#' control/src/ci/.env.ci >> $GITHUB_ENV

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build/Install local pseti package
        run: uv sync --all-extras
        working-directory: control

      - name: Pre-deploy Environment Check
        run: uv run pseti test hw check-env --pre-deploy
        working-directory: control

      - name: Teardown existing stack
        run: uv run pseti test hw down -v
        working-directory: control

      - name: Build hardware-software stack
        run: uv run pseti test hw build
        working-directory: control

      - name: Deploy hardware-software stack
        run: uv run pseti test hw deploy
        working-directory: control

      - name: Post-deploy Environment Check
        run: uv run pseti test hw check-env --post-deploy
        working-directory: control

      - name: Power Off Hardware (Assume State: UNPOWERED)
        run: docker compose -f src/ci/docker-compose.hw-sw.yml exec -T headnode-server pseti power off
        working-directory: control

      - name: Run Hardware Tests
        run: docker compose -f src/ci/docker-compose.hw-sw.yml exec -T headnode-server pseti test hw run --assume-state UNPOWERED -v
        working-directory: control

      - name: Final Safety Teardown
        if: always()
        run: |
          docker compose -f src/ci/docker-compose.hw-sw.yml exec -T headnode-server pseti power off || true
          uv run pseti test hw down -v
        working-directory: control
