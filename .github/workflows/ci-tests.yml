name: CI Tests

on:
  push:
    branches: [master, dev, test-hw-sw, claude-refactor, phase-2-robustness-and-driver-tests, add-linting, test-pseti]
    paths:
      - 'control/**'
      - '.github/workflows/ci-tests.yml'
  pull_request:
    branches: [master, dev, test-pseti]
    paths:
      - 'control/**'

jobs:
  # 1. Warm up the base cache.
  prepare-base:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Initialize required submodules
        run: git submodule update --init grpc grafana
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Export Host UID/GID
        run: |
          echo "HOST_UID=$(id -u)" >> $GITHUB_ENV
          echo "HOST_GID=$(id -g)" >> $GITHUB_ENV

      - name: Install host dependencies
        run: uv sync --all-extras
        working-directory: control

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Pre-build and Cache All Test Images
        run: |
          BUILDX_BAKE_ENTITLEMENTS_FS=0 docker buildx bake \
            -f control/src/ci/docker-compose.integration.yml \
            --pull=false \
            --set *.context=. \
            --set *.cache-from=type=gha,scope=pseti-ci \
            --set *.cache-to=type=gha,mode=max,scope=pseti-ci
        env:
          PSETI_CONTROL_BUILD: "."
          PSETI_ROOT_BUILD: ".."

  # 2. Software Tests (Matrix for Parallelism)
  software-tests:
    needs: prepare-base
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tier: ["lint all", "sw unit", "sw logic", "sw fleet", "sw chaos", "sw integration"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize required submodules
        run: git submodule update --init grpc grafana

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Export Host UID/GID
        run: |
          echo "HOST_UID=$(id -u)" >> $GITHUB_ENV
          echo "HOST_GID=$(id -g)" >> $GITHUB_ENV

      - name: Install host dependencies
        run: uv sync --all-extras
        working-directory: control

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build/Load Images (Tier-specific)
        run: |
          if [[ "${{ matrix.tier }}" == *"unit"* ]]; then
             compose_file="control/src/ci/docker-compose.unit.yml"
          else
             compose_file="control/src/ci/docker-compose.integration.yml"
          fi
          BUILDX_BAKE_ENTITLEMENTS_FS=0 docker buildx bake \
            -f $compose_file \
            --pull=false \
            --set *.context=. \
            --set *.cache-from=type=gha,scope=pseti-ci \
            --load
        env:
          PSETI_CONTROL_BUILD: "."
          PSETI_ROOT_BUILD: ".."

      - name: Run Test Tier
        run: uv run pseti test --no-build ${{ matrix.tier }}
        working-directory: control
        env:
          COMPOSE_PROJECT_NAME: ctl-int-${{ github.run_id }}-${{ matrix.tier }}
          BINDHOST: lo
          GRPC_PORT: 50051

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.tier }}
          path: control/.pytest_cache/
          if-no-files-found: ignore

  # 3. Hardware Tests (HITL)
  hardware-software-tests:
    needs: prepare-base
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize submodules
        run: git submodule update --init grpc grafana

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Export Host UID/GID
        run: |
          echo "HOST_UID=$(id -u)" >> $GITHUB_ENV
          echo "HOST_GID=$(id -g)" >> $GITHUB_ENV

      - name: Build/Install local pseti package
        run: uv sync --all-extras
        working-directory: control

      - name: Orchestrate HITL Sequence
        run: uv run python3 src/ci/hw_ci_orchestrator.py --no-fail-fast
        working-directory: control
        env:
          PSETI_CONTROL_BUILD: "."
          PSETI_ROOT_BUILD: ".."
