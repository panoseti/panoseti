name: Unit Tests

on:
  push:
    branches: [master, dev, claude-refactor, phase-2-robustness-and-driver-tests]
    paths:
      - 'control/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: [master, dev, mount-metadata, claude-refactor, phase-2-robustness-and-driver-tests]
    paths:
      - 'control/**'

jobs:
  unit-tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # The run-unit-tests.sh script handles building the Dockerfile, 
      # starting Redis, running pytest via Docker Compose, and tearing down.
      - name: Run unit tests via Docker
        run: bash run-ci-tests/run-unit-tests.sh
        working-directory: control

      # Because docker-compose.yml mounts the control/ directory to /app, 
      # the .pytest_cache generated inside the container will be available here.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: control/.pytest_cache/
          if-no-files-found: ignore